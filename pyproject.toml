[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irishlogix"
version = "0.1.0"
description = "Coupled Machine Learning Delay Analytics and Multi-Objective Carbon-Aware Route Optimisation for Post-Brexit Irish Freight Corridors"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Rohitkumar Amritlal Jaiswal", email = "rohit2426jaiswal@gmail.com" }
]
keywords = [
    "freight-logistics",
    "machine-learning",
    "xgboost",
    "route-optimization",
    "pareto-optimization",
    "post-brexit",
    "csrd",
    "ets2"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "networkx>=3.0",
    "requests>=2.28.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
ml = [
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "shap>=0.43.0",
]
app = [
    "streamlit>=1.30.0",
    "folium>=0.14.0",
    "plotly>=5.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
